<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quiz Night Live</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f7f9ff;background:#0b1223}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#22385d,#0b1223 60%);min-height:100vh}main{max-width:1300px;margin:auto;padding:24px}h1{font-size:clamp(34px,5vw,60px);margin:0;font-weight:950;letter-spacing:-2px}h1 b{color:#f7ce5a}h2{margin:0 0 14px}h3{margin:8px 0}p{line-height:1.5;color:#c4cfe0}.muted{color:#acbdd5}.grid{display:grid;grid-template-columns:1.7fr 1fr;gap:18px}.panel{border-radius:18px;padding:23px;background:#18263e;border:1px solid #364969;margin-top:18px}.question{font-size:clamp(25px,3.2vw,42px);font-weight:800;line-height:1.22;margin:20px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{border-radius:12px;padding:17px;background:#263855;border:1px solid #52617b;color:white;font-size:17px;font-weight:700;text-align:left}.choice strong{color:#ffcf64;margin-right:12px}.choice.active{background:#887025;border-color:#ffcf64}.choice.correct{background:#126c50;border-color:#62e4b8}.btn{padding:13px 17px;border:0;border-radius:10px;background:#f7ce5a;color:#14223a;font-weight:850;font-size:15px;cursor:pointer}.btn.alt{background:#334d72;color:white}.btn.green{background:#5ad6b4}.btn.red{background:#733745;color:white}.btn:disabled{opacity:.45}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.between{justify-content:space-between}.tag{font-size:12px;font-weight:800;letter-spacing:.1em;color:#66e5c1;text-transform:uppercase}.input{padding:13px 15px;background:#0e1b31;color:white;border:1px solid #51607a;border-radius:9px;font:inherit;min-width:0;max-width:100%}.input.wide{width:100%}.leader{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #364961;padding:12px 0;gap:8px}.leader span{font-weight:750}.score{color:#f7ce5a;font-size:23px;font-weight:900}.good{color:#60e4b9}.bad{color:#ff9ba8}.answer{padding:15px;border:1px solid #248c6f;background:#104235;border-radius:12px;margin:20px 0;font-weight:850;font-size:22px}.timer{font-size:36px;font-weight:900}.qr{width:210px;height:210px;background:white;padding:8px;border-radius:14px}.hostnote{border-left:3px solid #f7ce5a;padding-left:12px}.rounds{display:flex;overflow-x:auto;gap:8px;margin-top:18px}.round{min-width:140px;padding:11px;border-radius:9px;border:1px solid #3e5577;background:#182a45;color:#d6dfeb;cursor:pointer;text-align:left}.round.active{border-color:#f7ce5a;color:#f7ce5a}.player{display:flex;align-items:center;gap:10px}.player div:nth-child(2){flex:1}.player small{color:#abc1d6}.tiny{font-size:12px}.hidden{display:none!important}.hero{padding:28px 0 10px}.center{text-align:center}.phone{max-width:560px;margin:0 auto}.phone .options{grid-template-columns:1fr}.phone .choice{min-height:65px}.big{font-size:22px}.error{color:#ffb6bf}.link{word-break:break-all;color:#a2e8db;font-size:13px}.footer{margin-top:30px;font-size:12px;color:#90a1bd}.corrected{width:65px;padding:7px}@media(max-width:850px){.grid{grid-template-columns:1fr}main{padding:14px}.panel{padding:17px}}

/* Host-only game show effects */
.fx-toolbar{display:flex;align-items:center;gap:9px}.fx-sound{background:#293c60;color:#fff;border:1px solid #6888ae;padding:10px 15px;border-radius:12px;cursor:pointer;font-weight:800}.fx-sound:focus-visible{outline:3px solid #ffdc70}.fx-overlay{position:fixed;inset:0;z-index:999;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:hidden}.fx-overlay:empty{display:none}.fx-flash{position:absolute;inset:0;background:rgba(255,255,255,.25);animation:fxFlash .5s ease-out forwards}.fx-pop{position:relative;font-size:clamp(34px,6vw,82px);font-weight:1000;text-shadow:0 8px 25px #020917;padding:22px;text-align:center;animation:fxPop 1.65s ease-out forwards}.fx-footballer{font-size:110px;filter:drop-shadow(0 10px 16px #101828);animation:fxPlayer 2.4s ease-out forwards}.fx-redshirt{position:absolute;left:49px;top:63px;width:39px;height:38px;border-radius:9px 9px 12px 12px;background:#d42635;border:3px solid white;transform:rotate(-9deg)}.fx-footballer-wrap{position:relative;width:155px;height:180px;animation:fxPlayer 2.4s ease-out forwards}.fx-footballer-wrap span{font-size:115px}.fx-confetti{position:absolute;top:-25px;width:11px;height:20px;animation:fxFall var(--dur) linear forwards;transform:rotate(var(--rot));background:var(--color)}.fx-podium{position:absolute;bottom:4vh;left:50%;transform:translateX(-50%);display:flex;align-items:flex-end;gap:10px;animation:fxPodium 4.8s ease-out forwards}.fx-podium .place{min-width:min(23vw,180px);text-align:center;border-radius:14px 14px 0 0;padding:20px 9px;color:#15233a;font-weight:1000;box-shadow:0 10px 50px #0008}.fx-podium .first{height:215px;background:#ffd359}.fx-podium .second{height:155px;background:#cbd5e1}.fx-podium .third{height:115px;background:#e5a273}.fx-podium .name{font-size:clamp(14px,2vw,23px);overflow-wrap:anywhere}.fx-score-burst{animation:fxScore .7s ease-out}.fx-shake{animation:fxShake .55s ease-out}.fx-eliminated{color:#ff7886}.fx-standings{position:absolute;top:9%;font-weight:1000;font-size:clamp(27px,5vw,65px);text-align:center;text-shadow:0 5px 15px #000}.fx-celebration-title{position:absolute;top:4%;text-align:center;font-size:clamp(35px,6vw,75px);font-weight:1000;color:#ffe39b;text-shadow:0 5px 20px #000}
@keyframes fxFlash{from{opacity:1}to{opacity:0}}@keyframes fxPop{0%{transform:scale(.35);opacity:0}22%{transform:scale(1.15);opacity:1}35%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}@keyframes fxPlayer{0%{transform:translateY(100vh) rotate(-18deg) scale(.7)}28%{transform:translateY(-30px) rotate(10deg) scale(1.15)}44%{transform:translateY(0) rotate(-5deg)}75%{opacity:1}100%{transform:translateY(100vh) rotate(30deg);opacity:0}}@keyframes fxFall{to{top:112%;transform:translateX(var(--wind)) rotate(900deg)}}@keyframes fxPodium{0%{transform:translate(-50%,110vh)}22%{transform:translate(-50%,0)}90%{opacity:1}100%{opacity:0}}@keyframes fxScore{0%,100%{transform:scale(1)}30%{transform:scale(1.22);background:#356d58}}@keyframes fxShake{0%,100%{transform:translateX(0)}15%,45%,75%{transform:translateX(-8px)}30%,60%,90%{transform:translateX(8px)}}
@media(prefers-reduced-motion:reduce){.fx-pop,.fx-footballer-wrap,.fx-confetti,.fx-podium,.fx-flash,.fx-score-burst,.fx-shake{animation-duration:.01ms!important}}

.fx-player-portrait{width:min(32vw,270px);height:min(46vh,365px);object-fit:cover;object-position:center top;border:5px solid #ffde7a;border-radius:20px;box-shadow:0 16px 55px #000b;animation:fxPortrait 2.9s ease-in-out both}.fx-player-spotlight{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;z-index:2}.fx-player-spotlight strong{font-size:clamp(26px,4.8vw,65px);color:#fff;text-shadow:0 4px 15px #000}.fx-podium .portrait{height:clamp(95px,17vh,180px);width:100%;object-fit:cover;object-position:center 18%;border-radius:10px;border:3px solid #fff8;margin-bottom:8px}.fx-podium .place{height:auto!important;padding:10px 8px 18px!important}.fx-podium .first{padding-bottom:85px!important}.fx-podium .second{padding-bottom:43px!important}.fx-podium .third{padding-bottom:15px!important}.fx-podium .place{min-width:min(26vw,200px)}@keyframes fxPortrait{0%{opacity:0;transform:translateY(90vh) rotate(-10deg) scale(.65)}24%{opacity:1;transform:translateY(-12px) rotate(4deg) scale(1.06)}40%{transform:translateY(0) rotate(0) scale(1)}82%{opacity:1}100%{opacity:0;transform:translateY(-25px) scale(1.07)}}
</style></head><body><main id="app"></main><script>
let S=null,selected='',joinName='',avatar='⚽',host=location.pathname==='/host',hostKey=new URLSearchParams(location.search).get('key')||'',lastKey='',flash='';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const av=['⚽','🦁','🐼','🦊','👑','🐯','🐧','🚀','🔥','🏆'];let remoteJoin=location.origin+'/join';
async function api(path,data){let r=await fetch('/api/'+path+(path==='host'?'?key='+encodeURIComponent(hostKey):''),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function action(a,o={}){try{await api('host',{action:a,...o})}catch(e){alert(e.message)}}async function answer(v){try{await api('answer',{answer:v});selected=v;flash='Answer submitted!';render()}catch(e){flash=e.message;render()}}async function join(){const n=$('joinName')?.value.trim();if(!n)return;try{await api('join',{name:n,avatar});location.reload()}catch(e){flash=e.message;render()}}
function header(){return `<div class="hero row between"><div><h1>QUIZ <b>NIGHT.</b></h1><p>Two separate games · Live multiplayer</p></div><div class="fx-toolbar">${host?`<button class="fx-sound" onclick="toggleFxSound()" aria-label="Toggle sound effects">🔊 Sound: ${fxSoundEnabled?'on':'off'}</button>`:''}<div class="tag">${host?'HOST SCREEN':'PLAYER SCREEN'}</div></div></div>`}
function render(){if(!S)return;const el=$('app'),s=S.state,q=S.question,players=S.players,me=S.me,round=S.rounds[s.round];if(lastKey!==`${s.round}-${s.index}`){selected='';flash='';lastKey=`${s.round}-${s.index}`}if(!host){el.innerHTML=header()+`<div class="phone">${!me?`<div class="panel center"><h2>Join the quiz</h2><p>Enter your name, pick your avatar and get ready.</p><input id="joinName" class="input wide" placeholder="Your name / nickname" maxlength="28" value="${esc(joinName)}" oninput="joinName=this.value"><div class="row" style="justify-content:center;margin:16px 0">${av.map(x=>`<button class="choice ${avatar===x?'active':''}" style="padding:10px;font-size:23px" onclick="avatar='${x}';render()">${x}</button>`).join('')}</div><button class="btn" onclick="join()">Join game</button></div>`:`<div class="panel"><div class="row between"><div class="tag">${esc(round.section)} · ${esc(round.name)}</div><b>${esc(me.name)} · ${esc(players.find(p=>p.id===me.id)?.score||0)} pts</b></div>${me.eliminated?'<h2 class="bad">Eliminated ⚽</h2><p>You can still watch the game on the TV.</p>':s.completed?'<h2>Quiz completed 🏆</h2>':`<div class="muted">Question ${s.index+1} of ${round.count}</div><div class="question">${esc(q.text)}</div>${s.phase==='lobby'||s.phase==='ready'?'<p>Waiting for the host to start the question…</p>':s.phase==='answering'?(me.answer!=null?`<p class="good big">✓ Answer locked in: ${esc(me.answer)}</p><p>You may change it before the timer ends.</p>`:``)+ (q.mode==='choice'?`<div class="options">${q.options.map((o,i)=>`<button class="choice ${selected==='ABCD'[i]?'active':''}" onclick="answer('${'ABCD'[i]}')"><strong>${'ABCD'[i]}</strong>${esc(o)}</button>`).join('')}</div>`:`<form onsubmit="event.preventDefault();answer(document.getElementById('playerAnswer').value)"><input class="input wide" id="playerAnswer" type="${q.mode==='closest'?'number':'text'}" placeholder="${q.mode==='closest'?'Your numeric guess':'Type your answer'}" maxlength="120" required><button class="btn" style="margin-top:12px">Submit answer</button></form>`):`<div class="answer">✓ ${esc(q.answer)}</div><p>${me.answer==null?'No answer submitted':'Your answer: '+esc(me.answer)}</p><p>Waiting for next question…</p>`}`}</div>`}<p class="${flash.includes('submitted')?'good':'error'}">${esc(flash)}</p></div>`;return}
const count=players.filter(p=>p.answered&&!p.eliminated).length,active=players.filter(p=>!p.eliminated).length;el.innerHTML=header()+`<div class="row" style="margin-top:18px"><button class="btn ${s.game===0?'green':'alt'}" onclick="action('game',{game:0})">🏛️ GAME 1 · Political History</button><button class="btn ${s.game===1?'green':'alt'}" onclick="action('game',{game:1})">⚽ GAME 2 · Football</button></div><div class="rounds">${S.rounds.map((r,i)=>((s.game===0&&i<3)||(s.game===1&&i>=3))?`<button class="round ${s.round===i?'active':''}" onclick="action('round',{round:${i}})">${i<3?'🏛️':'⚽'} ${esc(r.name)}<div class="tiny">${r.count} questions</div></button>`:'').join('')}</div><div class="grid"><section><div class="panel"><div class="row between"><span class="tag">${esc(round.section)} · ${esc(round.name)}</span><span>Question ${s.index+1}/${round.count}</span></div><div class="question">${esc(q.text)}</div>${q.options?`<div class="options">${q.options.map((x,i)=>`<div class="choice ${s.phase==='revealed'&&q.answer===x?'correct':''}"><strong>${'ABCD'[i]}</strong>${esc(x)}</div>`).join('')}</div>`:''}${s.phase==='revealed'?`<div class="answer">✓ ${esc(q.answer)}</div>`:''}${s.completed?'<div class="answer">🏆 Game finished! Select the other game to start a separate competition.</div>':''}<div class="row between" style="margin-top:20px"><div><div class="tag">${esc(s.phase)} · ${count}/${active} answered</div><div class="timer" id="countdown">${s.deadline?Math.max(0,Math.ceil((s.deadline-Date.now())/1000))+'s':'—'}</div></div><div class="row"><button class="btn green" onclick="action('start')" ${s.phase==='answering'||s.completed?'disabled':''}>Start · 30s</button><button class="btn alt" onclick="action('pause')" ${s.phase!=='answering'?'disabled':''}>Pause</button><button class="btn" onclick="action('reveal')" ${s.phase==='revealed'||s.completed?'disabled':''}>Reveal</button><button class="btn alt" onclick="action('next')" ${s.phase!=='revealed'?'disabled':''}>Next →</button></div></div></div><div class="panel"><h2>🏆 Scoreboard</h2>${[...players].sort((a,b)=>b.score-a.score).map((p,i)=>`<div class="leader"><span>${i+1}. ${esc(p.avatar)} ${esc(p.name)} ${p.eliminated?'<span class="bad">OUT</span>':''}<small class="${p.answered?'good':'muted'}"> ${p.answered?'✓ submitted':''}</small>${s.phase==='revealed'?`<small> · ${esc(p.currentAnswer??'—')}</small>`:''}</span><div class="row"><span class="score">${p.score}</span>${s.phase==='revealed'?`<input class="input corrected" aria-label="Award points" type="number" min="0" max="${q.points}" value="${p.currentPoints}" onchange="action('award',{id:'${p.id}',points:Number(this.value)})">`:''}</div></div>`).join('')||'<p>No players yet. Ask everyone to scan the QR code.</p>'}</div></section><aside><div class="panel center"><h2>📱 Scan to join</h2><img class="qr" id="qr" alt="Join QR code" src="${qrSrc(remoteJoin)}"><p class="tiny">Or open this address on a phone:</p><div class="link">${esc(remoteJoin)}</div><p class="tiny hostnote">Players do not need a Claude account. Everyone must access the same running server.</p>${/localhost|127\.0\.0\.1/.test(location.hostname)?`<p class="bad tiny">Localhost won't work on other phones. Enter the computer's Wi-Fi IP address below.</p><input class="input wide" id="joinUrl" value="${esc(remoteJoin)}"><button class="btn alt" style="margin-top:8px" onclick="setJoinUrl()">Update QR</button>`:''}</div><div class="panel"><h3>Game controls</h3><p class="tiny">Start opens answer submissions. Answers lock when the timer ends or you press Reveal. Click Next to advance.</p><p class="tiny">Round 3 closest guesses: 3, 2, 1 points. Political History and Football are separate games, each with its own winner. Football round 1 eliminates the lowest scorer; the football final starts with fresh scores. Switching games preserves players but resets that game's active round.</p><button class="btn red" onclick="if(confirm('Reset all players and scores?')) action('reset')">Reset everything</button></div></aside></div><div class="footer">Keep this host URL private. The player QR link never includes the host key.</div>`}
function qrSrc(url){return 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=10&data='+encodeURIComponent(url)}function setJoinUrl(){let v=$('joinUrl').value.trim();try{let u=new URL(v);if(!['http:','https:'].includes(u.protocol))throw 0;remoteJoin=u.origin+'/join';render()}catch{alert('Enter a valid address, for example http://192.168.1.5:3000/join')}}
async function init(){try{let r=await fetch('/api/state'+(host?'?key='+encodeURIComponent(hostKey):''));S=await r.json();remoteJoin=S.joinUrl||remoteJoin;render();onFxUpdate(null,S);let es=new EventSource('/events'+(host?'?key='+encodeURIComponent(hostKey):''));es.addEventListener('update',e=>{let old=S?.me?.id;const oldState=S;S=JSON.parse(e.data);render();onFxUpdate(oldState,S)});es.onerror=()=>{flash='Connection lost. Reconnecting…'};}catch(e){$('app').innerHTML='<p class="error">Cannot connect to the quiz server.</p>'}}
setInterval(()=>{if(host&&S?.state?.deadline&&$('countdown'))$('countdown').textContent=Math.max(0,Math.ceil((S.state.deadline-Date.now())/1000))+'s'},250);init();

// Original game-show style effects: all audio is synthesised locally in the host browser.
let fxSoundEnabled=localStorage.getItem('quiz-fx-sound')!=='off',fxCtx=null,fxLastTick=null,fxLastDeadline=null;
let fxTimeout=null,fxLastAnimationId='';
function toggleFxSound(){fxSoundEnabled=!fxSoundEnabled;localStorage.setItem('quiz-fx-sound',fxSoundEnabled?'on':'off');if(fxSoundEnabled)getFxAudio();render()}
function getFxAudio(){if(!host||!fxSoundEnabled)return null;try{fxCtx=fxCtx||new (window.AudioContext||window.webkitAudioContext)();if(fxCtx.state==='suspended')fxCtx.resume();return fxCtx}catch{return null}}
function fxNote(freq=440,duration=.13,kind='sine',volume=.075,delay=0,endFreq=null){const a=getFxAudio();if(!a)return;const at=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=kind;o.frequency.setValueAtTime(Math.max(20,freq),at);if(endFreq)o.frequency.exponentialRampToValueAtTime(Math.max(20,endFreq),at+duration);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),at+.012);g.gain.exponentialRampToValueAtTime(.0001,at+duration);o.connect(g);g.connect(a.destination);o.start(at);o.stop(at+duration+.02)}
function fxSound(name){if(!host||!fxSoundEnabled)return;getFxAudio();switch(name){
case 'whoosh':fxNote(130,.28,'sawtooth',.05,0,920);break;
case 'tick':fxNote(1100,.08,'square',.045);break;
case 'horn':fxNote(220,.52,'sawtooth',.12);fxNote(277,.52,'sawtooth',.06);break;
case 'ding':fxNote(880,.45,'sine',.105);fxNote(1320,.36,'sine',.065,.04);break;
case 'right':fxNote(523,.12,'sine',.085);fxNote(659,.14,'sine',.09,.12);fxNote(784,.24,'sine',.09,.26);break;
case 'wrong':fxNote(320,.20,'sawtooth',.08,0,210);fxNote(190,.3,'sawtooth',.08,.18,105);break;
case 'drum':for(let i=0;i<17;i++)fxNote(95+i*7,.13,'triangle',.06,i*(.15-i*.004),40);fxNote(730,.5,'sine',.08,1.55);break;
case 'eliminate':fxNote(390,.26,'sawtooth',.09,0,295);fxNote(340,.27,'sawtooth',.09,.28,240);fxNote(265,.55,'sawtooth',.09,.56,115);break;
case 'fanfare':[523,659,784,1047,784,1047].forEach((n,i)=>fxNote(n,i===5?.75:.22,'triangle',.11,i*.19));break;
case 'applause':{const a=getFxAudio();if(!a)return;const length=Math.round(a.sampleRate*1.3),buffer=a.createBuffer(1,length,a.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<length;i++){const t=i/a.sampleRate;const pulse=Math.max(0,Math.sin(t*43))*Math.max(0,Math.sin(t*29));data[i]=(Math.random()*2-1)*pulse*.25*Math.min(1,t*15)*Math.min(1,(1.3-t)*4)}const src=a.createBufferSource(),gain=a.createGain();src.buffer=buffer;gain.gain.value=.24;src.connect(gain);gain.connect(a.destination);src.start();break;}
}}
function fxRoot(){let r=document.getElementById('fx-root');if(!r){r=document.createElement('div');r.id='fx-root';r.className='fx-overlay';r.setAttribute('aria-hidden','true');document.body.appendChild(r)}return r}
function fxOverlay(html,ms=2100){if(!host)return;const r=fxRoot();r.innerHTML=html;if(fxTimeout)clearTimeout(fxTimeout);fxTimeout=setTimeout(()=>r.innerHTML='',ms)}
function fxBurst(label,color='#fff',shake=false){fxOverlay(`<div class="fx-flash"></div><div class="fx-pop ${shake?'fx-eliminated':''}" style="color:${color}">${label}</div>`)}
function fxConfetti(){let el=fxRoot();for(let i=0;i<100;i++){const c=document.createElement('span');c.className='fx-confetti';c.style.left=Math.random()*100+'%';c.style.setProperty('--dur',(2+Math.random()*3)+'s');c.style.setProperty('--wind',(Math.random()*420-210)+'px');c.style.setProperty('--rot',Math.random()*360+'deg');c.style.setProperty('--color',['#f9d76e','#e54454','#63dbca','#ffffff','#7caaff'][i%5]);el.appendChild(c)}}
const customImages={jonathan:'/assets/jonathan.webp',avneesh:'/assets/avneesh.webp',senvy:'/assets/senvy.webp'};
function playerImage(name){const normal=String(name||'').trim().toLowerCase().replace(/[^a-z]/g,'');return customImages[normal]||null}
function fxPlayerSpotlight(player,caption='ROUND LEADER',ms=3000){if(!player)return false;const src=playerImage(player.name);if(!src)return false;fxOverlay(`<div class="fx-flash"></div><div class="fx-player-spotlight"><div class="fx-celebration-title" style="position:static">${esc(caption)}</div><img class="fx-player-portrait" src="${src}" alt="${esc(player.name)} celebration"><strong>${esc(player.name)}</strong></div>`,ms);fxConfetti();return true}
function fxRound(){fxSound('drum');fxOverlay('<div class="fx-flash"></div><div class="fx-footballer-wrap"><span>🙌</span><div class="fx-redshirt"></div></div>',2700)}
function fxPodium(snapshot){const players=[...snapshot.players].filter(p=>snapshot.state.game===0||!p.eliminated).sort((a,b)=>b.score-a.score).slice(0,3);const c=['second','first','third'];const items=[players[1],players[0],players[2]].map((p,i)=>`<div class="place ${c[i]}">${p&&playerImage(p.name)?`<img class="portrait" src="${playerImage(p.name)}" alt="${esc(p.name)}">`:`<div style="font-size:60px">${['🥈','🥇','🥉'][i]}</div>`}<div class="name">${p?esc(p.name):'—'}</div><div>${p?.score??''} pts</div></div>`).join('');fxSound('fanfare');fxSound('applause');fxOverlay(`<div class="fx-celebration-title">🏆 ${snapshot.state.game===0?'POLITICAL HISTORY':'FOOTBALL'} CHAMPION!</div><div class="fx-podium">${items}</div>`,5200);fxConfetti()}
function onFxUpdate(previous,current){if(!host||!current)return;const p=previous?.state,s=current.state;if(!p)return;
const changedQuestion=p.round!==s.round||p.index!==s.index||p.game!==s.game;
if(p.game!==s.game){fxSound('drum');fxBurst(s.game?'⚽ FOOTBALL':'🏛️ POLITICAL HISTORY','#ffdc76');return}
if(changedQuestion){fxSound('whoosh');if(p.round!==s.round){fxSound('drum');const leader=[...previous.players].filter(x=>!x.eliminated).sort((a,b)=>b.score-a.score)[0];if(!fxPlayerSpotlight(leader,'ROUND LEADER'))fxRound();if(s.round===4)fxSound('drum')}else fxBurst('NEXT QUESTION','#a5f5d6');return}
if(p.phase!==s.phase){if(s.phase==='answering'){fxLastDeadline=s.deadline;fxLastTick=null;fxSound('whoosh');fxBurst('GO!','#ffdb78')}
else if(s.phase==='revealed'){fxSound('ding');const scores=current.players.map(x=>x.currentPoints||0);if(scores.some(x=>x>0)){setTimeout(()=>fxSound('right'),230);setTimeout(()=>fxSound('applause'),450)}else setTimeout(()=>fxSound('wrong'),240);fxBurst('ANSWER REVEALED','#6ee7b7')}
else if(s.phase==='completed'){fxPodium(current)}
else if(s.phase==='ready'&&p.round===3&&s.round===4){fxRound()}}
if(s.eliminated?.length>p.eliminated?.length){fxSound('eliminate');const lost=current.players.find(x=>s.eliminated.includes(x.id)&&!p.eliminated.includes(x.id));if(!fxPlayerSpotlight(lost,'KNOCKED OUT!',2900))fxBurst('KNOCKED OUT!','#ff7886',true)}
if(s.phase==='revealed'&&p.phase==='revealed'&&current.players.some((x,i)=>x.score!==previous.players[i]?.score)){document.querySelectorAll('.score').forEach(x=>{x.classList.remove('fx-score-burst');void x.offsetWidth;x.classList.add('fx-score-burst')})}
}
setInterval(()=>{if(!host||!S||S.state.phase!=='answering'||!S.state.deadline){fxLastTick=null;return}const n=Math.max(0,Math.ceil((S.state.deadline-Date.now())/1000));if(n!==fxLastTick){fxLastTick=n;if(n>=1&&n<=5)fxSound('tick');if(n===0){fxSound('horn');fxBurst('TIME’S UP!','#ff8490',true)}}},120);
// Gesture on the host screen unlocks WebAudio, as required by browser autoplay policy.
document.addEventListener('pointerdown',()=>{if(host&&fxSoundEnabled)getFxAudio()},{passive:true});
</script></body></html>
